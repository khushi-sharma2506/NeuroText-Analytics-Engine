services:
  - type: web
    name: neurotext-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m spacy download en_core_web_sm"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0

  - type: web
    name: neurotext-ui
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python ui.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_URL
        value: "https://neurotext-api.onrender.com"
